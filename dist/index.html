    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ffffff;
        color: #000000;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html {
        scroll-behavior: smooth;
      }
      /* Hide scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      @keyframes pageEnter {
        0% { opacity: 0; transform: scale(0.96); }
        100% { opacity: 1; transform: none; }
      }
      .animate-page-enter {
        animation: pageEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Project detail: pure fade-in — “new page appears”, no slide/scale */
      @keyframes pageFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      .animate-page-fade-in {
        animation: pageFadeIn 0.35s ease-out forwards;
      }
      /* Back to landing: fade out — “leaving page” */
      @keyframes pageFadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .animate-page-fade-out {
        animation: pageFadeOut 0.25s ease-in forwards;
      }
    </style>
